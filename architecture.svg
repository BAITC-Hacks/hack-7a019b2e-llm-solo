<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
<title id="title">Архитектура проекта «Граф денег»</title><desc id="desc">Три обезличенных parquet файла проходят проверку качества, метрики и правила ролей, Louvain кластеризацию и расчёт приоритетов. Результат — три CSV и автономный экран графа.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#69d8c2"/></marker><style>
.bg{fill:#0b1220}.box{fill:#132137;stroke:#38506b;stroke-width:2;rx:18}.out{fill:#12342f;stroke:#48b9a3}.t{font:600 22px 'Segoe UI',Arial,sans-serif;fill:#e9f1fa}.s{font:16px 'Segoe UI',Arial,sans-serif;fill:#a9bad0}.title{font:700 32px 'Segoe UI',Arial,sans-serif;fill:#f0f5fb}.line{stroke:#69d8c2;stroke-width:3;fill:none;marker-end:url(#arrow)}.sub{font:15px 'Segoe UI',Arial,sans-serif;fill:#91a5bf}
</style></defs>
<rect class="bg" width="1440" height="560"/>
<text class="title" x="56" y="62">Граф денег · архитектура анализа</text>
<text class="sub" x="56" y="92">Локальный воспроизводимый пайплайн · только обезличенные транзакционные данные · объяснимые гипотезы</text>
<rect class="box" x="54" y="160" width="245" height="230"/>
<text class="t" x="78" y="204">Входные данные</text>
<text class="s" x="78" y="246">nodes.parquet</text><text class="s" x="78" y="278">edges.parquet</text><text class="s" x="78" y="310">transactions.parquet</text><text class="sub" x="78" y="350">2 248 узлов · июль 2026</text>
<path class="line" d="M299 275 H350"/>
<rect class="box" x="360" y="180" width="230" height="190"/>
<text class="t" x="384" y="225">Проверка</text><text class="s" x="384" y="267">Схема и gid</text><text class="s" x="384" y="297">Суммы / число переводов</text><text class="s" x="384" y="327">Качество исходных данных</text>
<path class="line" d="M590 275 H640"/>
<rect class="box" x="650" y="150" width="285" height="250"/>
<text class="t" x="674" y="195">Метрики графа</text><text class="s" x="674" y="238">Направленные потоки</text><text class="s" x="674" y="270">PageRank · HITS · seed reach</text><text class="s" x="674" y="302">Суммы / степени / быстрый транзит</text><text class="s" x="674" y="344">Louvain-сообщества</text><text class="sub" x="674" y="376">правила и пороги описаны в README</text>
<path class="line" d="M935 275 H985"/>
<rect class="box" x="995" y="160" width="205" height="230"/>
<text class="t" x="1018" y="204">Интерпретация</text><text class="s" x="1018" y="246">Роль + уверенность</text><text class="s" x="1018" y="278">Приоритет проверки</text><text class="s" x="1018" y="310">Объяснение с метриками</text><text class="sub" x="1018" y="350">гипотеза, не обвинение</text>
<path class="line" d="M1200 275 H1250"/>
<rect class="out" x="1260" y="130" width="160" height="300"/>
<text class="t" x="1282" y="174">Результаты</text><text class="s" x="1282" y="219">3 CSV</text><text class="s" x="1282" y="251">HTML-граф</text><text class="s" x="1282" y="283">Поиск gid</text><text class="s" x="1282" y="315">Карточка узла</text><text class="s" x="1282" y="347">Топ 50</text><text class="sub" x="1282" y="392">локальный запуск</text>
<rect x="55" y="465" width="1365" height="1" fill="#26354b"/>
<text class="sub" x="56" y="505">Ограничения учтены: исходящие переводы, порог 5 000 ₸, неполный вход seed и обрезка обхода на глубине 4.</text>
</svg>
